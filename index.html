<style>
/* BOLT — design tokens, layout e componentes */
:root {
  --acc-a: #2EE6D6; --acc-b: #2B7BFF;
  --accent: var(--acc-a); --accent-2: var(--acc-b);
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --bg: #070B11; --bg-2: #0D141D; --bg-3: #141D29; --bg-4: #1B2634;
  --line: #1F2B3A; --line-2: #2B3A4D;
  --text: #E8F1F8; --text-2: #9CB0C3; --text-3: #6B7F93;
  --ok: #3DDC97; --info: #5AA9FF; --warn: #FFA62B; --crit: #FF4D5E; --sim: #B79CFF;
  --on-accent: #04121A;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --r: 16px; --r-sm: 10px;
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  --nav-h: 58px; --hd-h: 52px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #EEF3F8; --bg-2: #FFFFFF; --bg-3: #F3F7FB; --bg-4: #E4ECF4;
  --line: #D9E3EE; --line-2: #C3D1E0;
  --text: #0E1A26; --text-2: #4A5F74; --text-3: #7589A0;
  --ok: #12A66A; --info: #2D7FE0; --warn: #D98200; --crit: #D8283B; --sim: #7B5CE6;
  --on-accent: #03141B;
  --shadow: 0 10px 28px rgba(30, 50, 80, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 1.35rem; letter-spacing: -.01em; }
h3 { font-size: 1.02rem; }
h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 14px 0 4px; }
a { color: inherit; text-decoration: none; }
small { font-size: .78rem; color: var(--text-2); }
.muted { color: var(--text-2); font-size: .88rem; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.icon { flex: none; }
pre { margin: 0; }

/* splash */
.splash { position: fixed; inset: 0; z-index: 99; display: grid; place-content: center; justify-items: center; gap: 8px; background: var(--bg); transition: opacity .4s; }
.splash strong { font-size: 1.6rem; letter-spacing: .3em; padding-left: .3em; }
.splash img { animation: splash-pop .8s cubic-bezier(.2,.7,.2,1) both; filter: drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 55%, transparent)); }
.splash small { color: var(--muted, #94a4b4); letter-spacing: .14em; text-transform: uppercase; font-size: .72rem; }
.splash-eyes { width: 150px; height: auto; margin: 2px 0; overflow: visible; }
.splash-eyes .se { fill: var(--accent); opacity: .1; filter: drop-shadow(0 0 7px var(--accent)); animation: splash-eyes 1.5s .45s ease-out forwards; }
@keyframes splash-pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
@keyframes splash-eyes { 0% { opacity: .1; } 35% { opacity: .95; } 55% { opacity: .5; } 100% { opacity: .95; } }
@media (prefers-reduced-motion: reduce) { .splash img, .splash-eyes .se { animation: none; } .splash-eyes .se { opacity: .9; } }
.splash.done { opacity: 0; pointer-events: none; }
.fatal { padding: 32px; max-width: 520px; margin: 10vh auto; display: grid; gap: 10px; }

/* casca */
#app { height: 100%; }
.app-shell { height: 100dvh; display: flex; flex-direction: column; padding-left: var(--sal); padding-right: var(--sar); background: radial-gradient(1200px 500px at 70% -10%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 60%), var(--bg); position: relative; }
.sim-strip { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; padding: calc(var(--sat) + 2px) 8px 2px; background: color-mix(in srgb, var(--sim) 22%, var(--bg)); color: var(--sim); font-size: .72rem; font-weight: 700; letter-spacing: .08em; }
.app-header { flex: none; display: flex; align-items: center; gap: 8px; min-height: var(--hd-h); padding: calc(var(--sat) * var(--hs, 1)) 12px 0; }
.is-sim .app-header { padding-top: 0; }
.app-shell:not(.is-sim) .app-header { padding-top: var(--sat); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand strong { letter-spacing: .22em; font-size: .95rem; }
.hd-vehicle { color: var(--text-2); font-size: .85rem; padding-left: 10px; border-left: 1px solid var(--line-2); max-width: 28vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hd-spacer { flex: 1; }
.hd-net { display: inline-flex; color: var(--ok); }
.hd-net.off { color: var(--warn); }
.app-view { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 14px 18px; scroll-behavior: smooth; outline: none; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

/* navegação inferior */
.app-nav { flex: none; display: flex; align-items: stretch; gap: 2px; padding: 6px 10px calc(6px + var(--sab)); background: color-mix(in srgb, var(--bg-2) 92%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(12px); position: relative; z-index: 5; }
.nav-item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 5px 2px; border-radius: 12px; color: var(--text-3); font-size: .68rem; font-weight: 600; transition: color .15s, background .15s; }
.nav-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nav-item:hover { color: var(--text-2); }
.nav-item.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.nav-lab, .nav-fold { align-self: center; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--text-3); background: none; border: 0; cursor: pointer; }
.nav-lab.active { color: var(--sim); background: color-mix(in srgb, var(--sim) 16%, transparent); }
.nav-lab:hover, .nav-fold:hover { color: var(--text); }
.nav-handle { position: absolute; left: 50%; bottom: calc(2px + var(--sab)); transform: translateX(-50%); z-index: 6; display: none; width: 52px; height: 22px; place-items: center; border-radius: 12px 12px 0 0; border: 1px solid var(--line-2); border-bottom: 0; background: var(--bg-2); color: var(--text-2); cursor: pointer; padding: 0; opacity: .8; }
.nav-collapsed .app-nav { display: none; }
.nav-collapsed .nav-handle { display: grid; }
.nav-collapsed .app-view { padding-bottom: 30px; }

/* botões e controles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; transition: transform .1s, background .15s, border-color .15s; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg-4); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: .85rem; border-radius: 10px; }
.btn-primary { background: var(--grad); color: var(--on-accent); border-color: transparent; }
.btn-primary:hover:not(:disabled) { background: var(--grad); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-3); color: var(--text); }
.btn-danger { background: color-mix(in srgb, var(--crit) 16%, transparent); border-color: color-mix(in srgb, var(--crit) 45%, transparent); color: var(--crit); }
.btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--crit) 26%, transparent); }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; padding: 0; transition: background .15s, color .15s; flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--bg-3); color: var(--text); }
.icon-btn:disabled { opacity: .4; }
.icon-btn.is-on { color: var(--accent); }
.icon-btn-primary { background: var(--grad); color: var(--on-accent); }
.icon-btn-primary:hover:not(:disabled) { background: var(--grad); color: var(--on-accent); filter: brightness(1.08); }
.bell-count { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: #170d00; font-size: .65rem; font-weight: 800; display: grid; place-items: center; }
.bell[data-level="critical"] .bell-count { background: var(--crit); color: #fff; }
.bell[data-level="info"] .bell-count { background: var(--info); color: #001225; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; letter-spacing: .02em; background: var(--bg-4); color: var(--text-2); white-space: nowrap; }
.badge-ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge-info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.badge-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge-crit { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit); }
.badge-sim { background: color-mix(in srgb, var(--sim) 20%, transparent); color: var(--sim); }

.input { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--text); font: inherit; }
textarea.input { resize: vertical; min-height: 70px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.input:disabled { opacity: .5; }
select.input { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.field { display: grid; gap: 5px; align-content: start; }
.field-label { font-size: .78rem; font-weight: 600; color: var(--text-2); }
.field-hint { color: var(--text-3); }
.field-error { color: var(--crit); }
.has-error .input { border-color: var(--crit); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.form-intro { color: var(--text-2); font-size: .88rem; margin-bottom: 10px; }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; flex: none; }
.switch-input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-track { width: 44px; height: 26px; border-radius: 999px; background: var(--bg-4); border: 1px solid var(--line-2); position: relative; transition: background .2s; flex: none; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-2); transition: transform .2s, background .2s; }
.switch-input:checked + .switch-track { background: var(--grad); border-color: transparent; }
.switch-input:checked + .switch-track .switch-thumb { transform: translateX(18px); background: #fff; }
.switch-input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch-label { font-size: .88rem; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--bg-3); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--text-2); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--bg-4); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 12px; scrollbar-width: none; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--text-3); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--text-2); font: inherit; font-size: .82rem; cursor: pointer; }
.chip:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
.chip:disabled { opacity: .4; }
.range { width: 100%; accent-color: var(--accent); }

/* cartões */
.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .92rem; color: var(--text); }
.card-title svg { color: var(--accent); }
.card-title small { font-weight: 400; margin-left: 4px; }
.card-actions { display: flex; gap: 6px; }
.empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 28px 16px; color: var(--text-2); }
.empty-ico { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 18px; background: var(--bg-3); color: var(--accent); }
.view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 4px 0 12px; }
.view-head p { color: var(--text-2); font-size: .88rem; }
.head-actions, .row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
.foot-note { color: var(--text-3); font-size: .78rem; }

.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--bg-2); font-size: .88rem; margin-bottom: 10px; }
.banner > span { flex: 1; }
.banner-info { border-color: color-mix(in srgb, var(--info) 40%, transparent); background: color-mix(in srgb, var(--info) 9%, var(--bg-2)); }
.banner-warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 9%, var(--bg-2)); }
.banner-ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 9%, var(--bg-2)); }
.banner-sim { border-color: color-mix(in srgb, var(--sim) 45%, transparent); background: color-mix(in srgb, var(--sim) 10%, var(--bg-2)); }
.banner svg { flex: none; }
.banner-info svg { color: var(--info); } .banner-warn svg { color: var(--warn); } .banner-ok svg { color: var(--ok); } .banner-sim svg { color: var(--sim); }

.pref-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.card > .pref-row:first-of-type, .card-head + .pref-row { border-top: 0; }
.pref-row > div:first-child { display: grid; gap: 2px; min-width: 0; }
.pref-row > :last-child { flex: none; max-width: 55%; }
.pref-row input.input, .pref-row select.input { width: 160px; }

/* painel */
.dash { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; grid-template-areas: "banner banner" "speed rpm" "status status" "metrics metrics" "trip trip"; }
.dash > .banner { grid-area: banner; margin: 0; }
.area-speed { grid-area: speed; } .area-rpm { grid-area: rpm; }
.area-status { grid-area: status; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.area-metrics { grid-area: metrics; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.area-trip { grid-area: trip; }
:root[data-layout="landscape"] .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.25fr); grid-template-areas: "banner banner banner" "speed rpm status" "speed rpm metrics" "speed rpm trip"; align-items: start; }
:root[data-layout="landscape"] .area-status { grid-template-columns: 1fr 1fr; }
:root[data-layout="landscape"] .area-status > :first-child, :root[data-layout="landscape"] .area-status > :last-child { grid-column: 1 / -1; }
:root[data-layout="landscape"] .area-metrics { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.gauge-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; place-items: center; align-self: start; }
.gauge { width: 100%; max-width: 360px; position: relative; }
.gauge-svg { width: 100%; height: auto; display: block; }
:root[data-layout="landscape"] .gauge { max-width: min(100%, calc(100dvh - 170px)); }
.g-track { fill: none; stroke: var(--bg-4); stroke-width: 11; stroke-linecap: round; }
.g-value { fill: none; stroke-width: 11; stroke-linecap: round; transition: stroke-dasharray .25s ease-out; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent)); }
.g-red { fill: none; stroke: color-mix(in srgb, var(--crit) 55%, transparent); stroke-width: 11; stroke-linecap: butt; }
.g-tick { stroke: var(--line-2); stroke-width: 1.4; } .g-tick.red { stroke: var(--crit); }
.g-tick-label { fill: var(--text-3); font-size: 9px; font-weight: 600; }
.g-num { fill: var(--text); font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
.g-label { fill: var(--text-2); font-size: 10px; letter-spacing: .16em; font-weight: 700; }
.g-unit { fill: var(--text-3); font-size: 10px; }
.gauge.in-red .g-num { fill: var(--crit); }
.gauge[data-validity="stale"] .g-value, .gauge[data-validity="stale"] .g-num { opacity: .45; }
.gauge[data-validity="unavailable"] .g-num, .gauge[data-validity="unsupported"] .g-num, .gauge[data-validity="invalid"] .g-num { fill: var(--text-3); }
.gauge-note { text-align: center; font-size: .72rem; color: var(--text-3); min-height: 1.1em; margin-top: -6px; }
.gauge[data-validity="stale"] .gauge-note, .gauge[data-validity="invalid"] .gauge-note { color: var(--warn); }

.metric { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; position: relative; overflow: hidden; }
.metric > header { display: flex; align-items: center; gap: 6px; }
.m-ico { color: var(--accent); display: inline-flex; }
.m-label { font-size: .74rem; font-weight: 600; color: var(--text-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-value { display: flex; align-items: baseline; gap: 4px; }
.m-num { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.m-unit { color: var(--text-3); font-size: .8rem; }
.m-sub { font-size: .72rem; color: var(--text-3); min-height: 1em; }
.m-avg { font-size: .75rem; color: var(--accent); }
.m-spark { height: 24px; }
.spark { width: 100%; height: 24px; display: block; }
.spark-line { stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.metric-wide { grid-column: 1 / -1; }
.src-tag { display: none; font-size: .6rem; font-weight: 800; letter-spacing: .08em; padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--sim) 22%, transparent); color: var(--sim); }
.is-sim .src-tag { display: inline-block; }
.metric[data-validity="unavailable"] .m-num, .metric[data-validity="unsupported"] .m-num, .metric[data-validity="invalid"] .m-num { color: var(--text-3); }

.trip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; align-items: center; }

/* diagnóstico */
.dtc-list, .due-list, .sched-list, .service-list, .op-list, .result-list, .check-list { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }

.dtc-code { font: 700 1.05rem ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
.dtc-desc { color: var(--text); } .dtc-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.dtc-body { color: var(--text-2); font-size: .85rem; display: grid; gap: 6px; }

/* manutenção */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.level-card { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg-2); }
.level-ico { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: var(--bg-3); }

.level-attention .level-ico { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); } .level-attention { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.level-critical .level-ico { color: var(--crit); background: color-mix(in srgb, var(--crit) 16%, transparent); } .level-critical { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }

.sched-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.sched-actions { display: flex; gap: 4px; flex: none; }
.progress { height: 6px; border-radius: 3px; background: var(--bg-4); overflow: hidden; } .progress > * { display: block; height: 100%; background: var(--grad); border-radius: 3px; }
.st-overdue .progress > * { background: var(--crit); } .st-soon .progress > * { background: var(--warn); }

.ops, .clear-card { display: grid; gap: 10px; }

/* laboratório */
.lab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }

.pedal-gas.on { background: color-mix(in srgb, var(--ok) 22%, var(--bg-3)); border-color: var(--ok); }
.pedal-brake.on { background: color-mix(in srgb, var(--crit) 22%, var(--bg-3)); border-color: var(--crit); }
.slider-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; font-size: .85rem; }

.scenario-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }

.scenario:disabled { opacity: .45; }
.pid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.pid-opt { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
.view-lab .card-title svg { color: var(--sim); }

/* configurações / OBD */
.settings-content { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }

.avail-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.json-preview { background: var(--bg-3); border-radius: 12px; padding: 12px; font: .78rem/1.5 ui-monospace, Menlo, monospace; overflow: auto; max-height: 50vh; white-space: pre-wrap; word-break: break-word; }

.adapter-list { display: grid; gap: 8px; }
.adapter { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--text); font: inherit; cursor: pointer; }
.adapter > div { flex: 1; display: grid; min-width: 0; }
.adapter.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--bg-3)); }

.conn-status { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 13px; background: var(--bg-3); }
.conn-status.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); } .conn-status.ok small { color: var(--text-2); } .conn-status.ok strong { color: var(--text); }
.obd-log { background: var(--bg-3); border-radius: 10px; padding: 8px 10px; font: .72rem/1.5 ui-monospace, Menlo, monospace; color: var(--text-2); max-height: 120px; overflow: auto; white-space: pre-wrap; }
.wifi-box { display: grid; gap: 10px; }
.modal-foot-inner { display: flex; gap: 8px; justify-content: flex-end; width: 100%; }

/* modais e toasts */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(3, 7, 12, .66); backdrop-filter: blur(4px); opacity: 0; transition: opacity .18s; }
.overlay.in { opacity: 1; }
.modal { width: 100%; max-width: 520px; max-height: min(86dvh, 760px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: var(--shadow); transform: translateY(8px) scale(.98); transition: transform .18s; }
.overlay.in .modal { transform: none; }
.modal-lg { max-width: 760px; } .modal-sm { max-width: 400px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }

.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px calc(12px + var(--sab)); border-top: 1px solid var(--line); }
.modal-foot:empty { display: none; }
.confirm-msg { color: var(--text-2); }
.toasts { position: fixed; z-index: 90; top: calc(var(--sat) + 10px); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(440px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 13px; background: var(--bg-3); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: .88rem; opacity: 0; transform: translateY(-8px); transition: all .22s; cursor: pointer; }
.toast.in { opacity: 1; transform: none; }
.toast-ok svg { color: var(--ok); } .toast-warn svg { color: var(--warn); } .toast-error { border-color: var(--crit); } .toast-error svg { color: var(--crit); } .toast-info svg { color: var(--info); }
.alert-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 13px; background: var(--bg-3); border-left: 4px solid var(--info); }
.alert-item > div { flex: 1; } .alert-item p { color: var(--text-2); font-size: .85rem; } .alert-item strong { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lvl-attention { border-left-color: var(--warn); } .lvl-attention .ai-ico { color: var(--warn); } .lvl-critical { border-left-color: var(--crit); } .lvl-critical .ai-ico { color: var(--crit); } .lvl-info .ai-ico { color: var(--info); }
.alerts-panel { display: grid; gap: 8px; }

/* mascote: os olhos da alma do carro */
.bolt-mascot { display: inline-block; width: var(--ms, 44px); height: calc(var(--ms, 44px) * .875); flex: none; --mc-eye: var(--accent); line-height: 0; }
.bolt-mascot svg { width: 100%; height: 100%; overflow: visible; }
.bolt-mascot .m-eye { fill: var(--mc-eye); opacity: .85; filter: drop-shadow(0 0 3px var(--mc-eye)); transform-box: fill-box; transform-origin: center; animation: m-breathe 3.4s ease-in-out infinite; transition: opacity .3s; }
.bolt-mascot .m-bar { fill: var(--mc-eye); opacity: 0; transform-box: fill-box; transform-origin: center bottom; transform: scaleY(.3); transition: opacity .25s; }
.bolt-mascot[data-state="sleeping"] .m-eye { opacity: .16; animation: none; }
.bolt-mascot[data-state="listening"] .m-eye { opacity: 1; animation: none; }
.bolt-mascot[data-state="listening"] .m-bar { opacity: .7; animation: m-wave 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * -.12s); }
.bolt-mascot[data-state="thinking"] .m-eye { animation: m-think 1.2s ease-in-out infinite; }
.bolt-mascot[data-state="thinking"] .m-eye-r { animation-delay: .15s; }
.bolt-mascot[data-state="speaking"] .m-eye { opacity: 1; animation: m-talk .38s ease-in-out infinite alternate; }
.bolt-mascot[data-state="speaking"] .m-bar { opacity: 1; animation: m-speak .45s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.063s); }
.bolt-mascot[data-state="attention"] { --mc-eye: var(--warn); }
.bolt-mascot[data-state="alert"] { --mc-eye: var(--crit); }
.bolt-mascot[data-state="alert"] .m-eye { opacity: 1; animation: m-talk .3s ease-in-out infinite alternate; }
.bolt-mascot.is-off { filter: grayscale(1); opacity: .45; }
.bolt-mascot.is-off .m-bar, .bolt-mascot.is-off .m-eye { animation: none; }
@keyframes m-breathe { 0%, 100% { opacity: .7; } 50% { opacity: .98; } }
@keyframes m-talk { from { opacity: .65; } to { opacity: 1; } }
@keyframes m-think { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes m-wave { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@keyframes m-speak { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .bolt-mascot .m-eye, .bolt-mascot .m-bar { animation: none !important; } }

/* assistente */
.assistant-win { position: fixed; z-index: 40; right: calc(14px + var(--sar)); bottom: calc(var(--nav-h) + var(--sab) + 12px); width: min(390px, calc(100vw - 28px)); height: min(560px, calc(100dvh - var(--nav-h) - var(--hd-h) - 40px)); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 22px; box-shadow: var(--shadow); opacity: 0; transform: translateY(14px) scale(.97); transform-origin: bottom right; transition: opacity .2s, transform .2s, width .2s, height .2s, right .2s, bottom .2s, border-radius .2s; overflow: hidden; }
.assistant-win.in { opacity: 1; transform: none; }
.nav-collapsed .assistant-win { bottom: calc(34px + var(--sab)); height: min(560px, calc(100dvh - var(--hd-h) - 60px)); }
.assistant-win.expanded { inset: 0; width: auto; height: auto; border-radius: 0; right: 0; bottom: 0; padding-top: var(--sat); }
.asst-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent); }
.asst-title { display: grid; flex: 1; min-width: 0; line-height: 1.2; }
.asst-ctrl { display: flex; gap: 0; } .asst-ctrl .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
.asst-body { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.asst-messages { flex: 1; min-height: 0; }
.asst-quick, .asst-off { flex: none; }
.asst-off { display: none; align-items: center; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--warn) 10%, transparent); }
.asst-off > div { flex: 1; } .asst-off p { font-size: .8rem; color: var(--text-2); }
.is-off .asst-off { display: flex; }
.asst-messages { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.asst-welcome { display: grid; gap: 6px; color: var(--text-2); font-size: .9rem; }
.msg { display: grid; gap: 2px; max-width: 86%; }
.msg small { font-size: .66rem; color: var(--text-3); padding: 0 6px; }
.msg-user { align-self: flex-end; justify-items: end; } .msg-assistant { align-self: flex-start; }
.bubble { padding: 9px 13px; border-radius: 16px; background: var(--bg-3); font-size: .92rem; word-break: break-word; }
.msg-user .bubble { background: var(--grad); color: var(--on-accent); border-bottom-right-radius: 5px; }
.msg-assistant .bubble { border-bottom-left-radius: 5px; }
.bubble.typing { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: m-think 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.asst-quick { min-width: 0; display: flex; gap: 6px; padding: 6px 12px; overflow-x: auto; scrollbar-width: none; }
.asst-quick .chip { flex: none; }
.asst-input { display: flex; gap: 6px; padding: 10px 12px calc(10px + var(--sab)); border-top: 1px solid var(--line); align-items: center; }
.assistant-win:not(.expanded) .asst-input { padding-bottom: 10px; }
.asst-input .input { flex: 1; }
.asst-talk.is-on { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.is-off .asst-messages, .is-off .asst-quick { opacity: .5; }
.assistant-win.expanded .asst-messages { max-width: 820px; width: 100%; margin: 0 auto; }
.assistant-win.expanded .asst-input, .assistant-win.expanded .asst-quick { max-width: 820px; width: 100%; margin: 0 auto; }

/* retrato */
:root[data-layout="portrait"] .assistant-win { right: 8px; left: 8px; width: auto; bottom: calc(var(--nav-h) + var(--sab) + 8px); height: min(70dvh, 560px); }
:root[data-layout="portrait"] .nav-collapsed .assistant-win { bottom: calc(34px + var(--sab)); }
:root[data-layout="portrait"] .assistant-win.expanded { left: 0; right: 0; bottom: 0; height: auto; }
:root[data-layout="portrait"] .trips-layout { grid-template-columns: 1fr; }
:root[data-layout="portrait"] .hd-vehicle { display: none; }
@media (max-width: 640px) {
  .app-view { padding: 8px 10px 14px; }
  .settings-content, .lab-grid { grid-template-columns: 1fr; }
  .pref-row { flex-wrap: wrap; } .pref-row > :last-child { max-width: 100%; }
  .nav-item span { font-size: .62rem; }
  .slider-row { grid-template-columns: 1fr auto; } .slider-row label { grid-column: 1 / -1; }
  .brand strong { display: none; }
}
/* paisagem baixa (celular deitado) */
@media (max-height: 460px) {
  :root { --nav-h: 46px; --hd-h: 42px; }
  .nav-item { flex-direction: row; gap: 6px; font-size: .74rem; padding: 2px 4px; } .nav-item span { display: inline; }
  .app-nav { padding-top: 3px; padding-bottom: calc(3px + var(--sab)); }
  .assistant-win { height: calc(100dvh - var(--hd-h) - var(--nav-h) - 18px); }
  .gauge-card { padding: 4px; }
  .m-num { font-size: 1.35rem; } .metric { padding: 7px 10px; } .m-spark { height: 18px; } .spark { height: 18px; }
}
@media (max-height: 460px) and (max-width: 760px) { .nav-item span { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* foto do veículo */
.vehicle-photo { display: block; width: 100%; max-height: 190px; object-fit: cover; border-radius: 12px; }
.look-preview .vehicle-photo { max-width: 360px; max-height: 220px; }
.photo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 4px 0 14px; }

/* BOLT PERFORMANCE — cockpit (tela Painel). Carregado depois de styles.css; tudo é escopado ao cockpit
   (.cockpit e .app-shell[data-route="panel"]) para não alterar as demais telas. */

.nav-lab-txt { display: none; }

/* ============ casca na rota do painel ============ */
.app-shell[data-route="panel"] { background:
  radial-gradient(900px 420px at 12% -8%, rgba(22, 139, 255, .22), transparent 62%),
  radial-gradient(900px 420px at 92% -8%, rgba(34, 215, 242, .13), transparent 62%),
  radial-gradient(700px 360px at 50% 105%, rgba(22, 139, 255, .10), transparent 70%),
  #080B10; }
.app-shell[data-route="panel"] .app-header { display: none; }
.app-shell[data-route="panel"]:not(.is-sim) .cockpit { padding-top: var(--sat); }
.app-view[data-route="panel"] { padding: 0; scroll-behavior: auto; }
.app-shell[data-route="panel"] .sim-strip { background: rgba(160, 107, 255, .16); color: #C9B0FF; }
.nav-collapsed[data-route="panel"] .app-view { padding-bottom: 28px; }

/* ============ cockpit ============ */
.cockpit {
  --k-bg: #080B10; --k-g1: #111820; --k-g2: #19232D;
  --k-blue: #168BFF; --k-cyan: #22D7F2; --k-red: #F04452; --k-green: #35D69A; --k-amber: #FFA62B; --k-violet: #A98BFF;
  --k-white: #F3F7FB; --k-mut: #94A4B4; --k-line: rgba(110, 160, 220, .22);
  --gs: clamp(176px, min(calc(100dvh - 430px), 23vw), 500px);
  min-height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 0 12px 12px; color: var(--k-white);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.cockpit button { font: inherit; color: inherit; }

/* ---- cabeçalho ---- */
.ck-header { position: relative; z-index: 12; flex: none; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 4px 2px; border-bottom: 1px solid transparent; background: linear-gradient(180deg, transparent, transparent) padding-box; }
.ck-header::after { content: ""; position: absolute; left: -12px; right: -12px; bottom: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(34, 215, 242, .5) 20%, rgba(22, 139, 255, .6) 50%, rgba(34, 215, 242, .5) 80%, transparent); box-shadow: 0 0 14px rgba(22, 139, 255, .55); }
.ck-sp { flex: 1; }
.ck-ibtn { position: relative; flex: none; display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: #DDE7F1; cursor: pointer; transition: background .15s, color .15s; }
.ck-ibtn:hover { background: rgba(22, 139, 255, .14); color: #fff; }
.ck-menu { gap: 5px; align-content: center; }
.ck-menu i { display: block; width: 22px; height: 2.5px; border-radius: 2px; background: #E4EDF6; }
.ck-brand { display: flex; align-items: center; gap: 6px; flex: none; }
.ck-bolt { width: 20px; height: 30px; fill: var(--k-cyan); filter: drop-shadow(0 0 6px rgba(34, 215, 242, .7)); order: 2; margin-left: -4px; margin-right: 2px; }
.ck-brand strong { order: 1; font-size: 1.85rem; font-weight: 900; font-style: italic; letter-spacing: .01em; line-height: 1; background: linear-gradient(180deg, #fff 10%, #9db2c8 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ck-brand span { order: 3; font-size: .8rem; font-style: italic; font-weight: 500; letter-spacing: .28em; color: #A9B9C9; margin-top: 4px; }
.ck-vwrap { position: relative; min-width: 0; flex: 0 1 auto; }
@media (min-width: 1100px) and (min-aspect-ratio: 1/1) { .ck-vwrap { position: absolute; left: 50%; transform: translateX(-50%); } }
.ck-vsel { display: flex; align-items: center; gap: 12px; min-width: 250px; height: 48px; padding: 0 16px; border: 1px solid rgba(34, 215, 242, .35); border-top-color: rgba(34, 215, 242, .12); border-radius: 0 0 22px 22px; background: linear-gradient(180deg, #0c131b, #17222e); box-shadow: 0 6px 22px rgba(22, 139, 255, .25), inset 0 -1px 0 rgba(34, 215, 242, .4); cursor: pointer; font-weight: 700; font-size: 1.05rem; }
.ck-vsel .icon { margin-left: auto; color: #DDE7F1; }
.ck-vname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 24ch; }
.ck-mono { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #7EC4FF; color: #D8ECFF; font-weight: 800; font-size: .85rem; background: radial-gradient(circle at 35% 30%, #23507f, #0c1d30); }
.ck-mono-lg { width: 52px; height: 52px; font-size: 1.2rem; }
.ck-vmenu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 30; min-width: 280px; max-height: 60vh; overflow: auto; padding: 6px; border-radius: 16px; border: 1px solid var(--k-line); background: #0D141C; box-shadow: 0 18px 50px rgba(0, 0, 0, .7), 0 0 0 1px rgba(22, 139, 255, .15); }
.ck-vopt { display: grid; width: 100%; gap: 1px; text-align: left; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
.ck-vopt:hover, .ck-vopt:focus-visible { background: rgba(22, 139, 255, .14); }
.ck-vopt.on { background: rgba(34, 215, 242, .12); box-shadow: inset 3px 0 0 var(--k-cyan); }
.ck-vopt small { color: var(--k-mut); }
.ck-vgarage { display: flex; align-items: center; gap: 8px; margin-top: 4px; border-top: 1px solid rgba(255, 255, 255, .06); border-radius: 0 0 10px 10px; color: #9FD3FF; }
.ck-vempty { padding: 12px; color: var(--k-mut); }
.ck-chip { display: flex; align-items: center; gap: 9px; flex: none; padding: 4px 8px; border: 0; border-radius: 12px; background: transparent; cursor: default; }
.ck-conn { cursor: pointer; }
.ck-conn:hover { background: rgba(22, 139, 255, .12); }
.ck-ctext { display: grid; text-align: left; line-height: 1.2; }
.ck-ctext strong { font-size: .95rem; color: var(--k-green); }
.ck-ctext small { color: var(--k-mut); font-size: .78rem; }
.ck-dot { width: 12px; height: 12px; border-radius: 50%; background: #5d6d7e; box-shadow: 0 0 0 3px rgba(255, 255, 255, .05); }
.ck-conn[data-tone="ok"] .ck-dot { background: var(--k-green); box-shadow: 0 0 10px var(--k-green); animation: ck-pulse 2.8s ease-in-out infinite; }
.ck-conn[data-tone="info"] .ck-dot, .ck-conn[data-tone="warn"] .ck-dot { background: var(--k-amber); box-shadow: 0 0 10px var(--k-amber); animation: ck-pulse 1.2s ease-in-out infinite; }
.ck-conn[data-tone="crit"] .ck-dot { background: var(--k-red); box-shadow: 0 0 10px var(--k-red); }
.ck-conn[data-tone="sim"] .ck-dot { background: var(--k-violet); box-shadow: 0 0 10px var(--k-violet); }
.ck-conn[data-tone="ok"] strong { color: var(--k-green); } .ck-conn[data-tone="warn"] strong, .ck-conn[data-tone="info"] strong { color: var(--k-amber); } .ck-conn[data-tone="crit"] strong { color: var(--k-red); } .ck-conn[data-tone="sim"] strong { color: var(--k-violet); } .ck-conn[data-tone="off"] strong { color: #C5D1DC; }
.ck-net { flex-direction: column; gap: 0; align-items: center; color: #BFD0E0; }
.ck-net small { color: #DDE7F1; font-size: .78rem; font-weight: 600; }
.ck-net[data-on="0"] { color: var(--k-amber); } .ck-net[data-on="0"] small { color: var(--k-amber); }
.ck-simtag { padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(169, 139, 255, .6); background: rgba(169, 139, 255, .16); color: #CDBBFF; font-size: .72rem; font-weight: 800; letter-spacing: .1em; }
.ck-bellcount { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--k-amber); color: #170d00; font-size: .68rem; font-weight: 800; display: grid; place-items: center; }
.ck-bell[data-level="critical"] .ck-bellcount { background: var(--k-red); color: #fff; }
.ck-bell[data-level="critical"] { color: var(--k-red); }
.ck-clock { display: grid; justify-items: end; line-height: 1.15; padding-left: 14px; margin-left: 2px; border-left: 1px solid rgba(255, 255, 255, .14); font-variant-numeric: tabular-nums; }
.ck-clock strong { font-size: 1.5rem; font-weight: 600; letter-spacing: .02em; }
.ck-clock small { color: #C3D0DC; font-size: .82rem; }
.ck-banner { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(22, 139, 255, .4); background: rgba(22, 139, 255, .1); font-size: .88rem; }
.ck-banner > span { flex: 1; }

/* ---- região principal ---- */
.ck-main { position: relative; flex: 1 0 auto; display: grid; grid-template-columns: var(--gs) minmax(0, 1fr) var(--gs) minmax(150px, 14vw); gap: 10px; flex: 1 0 var(--gs); min-height: var(--gs); }
.ck-speed, .ck-rpm { position: relative; width: var(--gs); height: var(--gs); align-self: center; }
.ck-stagewrap { position: relative; min-width: 0; min-height: 0; }

/* mostradores */
.cg { position: relative; width: 100%; height: 100%; }
.cg::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; background: radial-gradient(circle, rgba(22, 139, 255, .2), transparent 68%); pointer-events: none; animation: ck-ignite 1.1s ease-out both; }
.cg-svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible; animation: ck-ignite 1s ease-out both; }
.cg-rim { stroke: rgba(34, 215, 242, .22); stroke-width: 1; }
.cg-track { fill: none; stroke: rgba(255, 255, 255, .07); stroke-width: 12; stroke-linecap: round; }
.cg-zone { fill: none; stroke-width: 12; stroke-linecap: butt; }
.cg-zone-warn { stroke: rgba(255, 166, 43, .42); } .cg-zone-red { stroke: rgba(240, 68, 82, .62); }
.cg-glow { fill: none; stroke-width: 26; stroke-linecap: round; opacity: .2; }
.cg-val { fill: none; stroke-width: 12; stroke-linecap: round; }
.cg-core { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: 2; stroke-linecap: round; }
.cg-tip-halo { fill: rgba(34, 215, 242, .28); } .cg-tip-dot { fill: #fff; }
.cg.in-red .cg-tip-halo { fill: rgba(240, 68, 82, .35); }
.cg-tick { stroke: rgba(196, 214, 232, .6); stroke-linecap: round; }
.cg-tick.major { stroke-width: 2.2; } .cg-tick.minor { stroke-width: 1.1; stroke: rgba(196, 214, 232, .35); }
.cg-tick.red { stroke: var(--k-red); }
.cg-tl { fill: #E2ECF5; font-size: 17px; font-weight: 600; font-style: italic; }
.cg-tl.red { fill: var(--k-red); }
.cg-num { fill: #fff; font-size: 68px; font-weight: 800; font-style: italic; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cg-rpm .cg-num { font-size: 56px; }
.cg.in-red .cg-num { fill: #FF8A93; }
.cg-unit { fill: #B4C3D2; font-size: 22px; letter-spacing: .03em; }
.cg-foot { fill: #7F93A7; font-size: 12px; }
.cg[data-validity="stale"] .cg-val, .cg[data-validity="stale"] .cg-num { opacity: .5; }
.cg[data-validity="unavailable"] .cg-num, .cg[data-validity="unsupported"] .cg-num, .cg[data-validity="invalid"] .cg-num { fill: #6C7F92; }
.cg-note { position: absolute; left: 10%; right: 10%; bottom: 3%; text-align: center; font-size: .7rem; color: #7F93A7; min-height: 1em; pointer-events: none; }
.cg[data-validity="stale"] .cg-note, .cg[data-validity="invalid"] .cg-note { color: var(--k-amber); }

/* palco do veículo */
.stage { position: absolute; inset: 0; overflow: hidden; border-radius: 22px; background: #05080C; isolation: isolate; -webkit-mask-image: radial-gradient(ellipse 98% 98% at 50% 50%, #000 78%, transparent 100%); mask-image: radial-gradient(ellipse 98% 98% at 50% 50%, #000 78%, transparent 100%); }
.stage-room i { position: absolute; display: block; pointer-events: none; }
.sr-wall { left: 0; right: 0; top: 0; height: 62%; background: linear-gradient(180deg, #1c2631 0%, #101820 52%, #0a1016 100%); }
.sr-wall::after { content: ""; position: absolute; left: 24%; right: 24%; top: 14%; bottom: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .015) 70%, transparent); border-left: 1px solid rgba(255, 255, 255, .05); border-right: 1px solid rgba(255, 255, 255, .05); }
.sr-ceiling { left: 33%; right: 33%; top: 0; height: 10%; clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%); background: linear-gradient(180deg, #DDEFFF, #6FA6D8); opacity: .55; box-shadow: 0 0 40px rgba(180, 220, 255, .5); }
.sr-strip { top: 10%; height: 48%; width: 3px; background: linear-gradient(180deg, transparent, #D8EEFF 25%, #D8EEFF 75%, transparent); box-shadow: 0 0 14px rgba(160, 210, 255, .65); opacity: .8; }
.sr-strip-l { left: 12%; } .sr-strip-r { right: 12%; }
.sr-floor { left: 0; right: 0; bottom: 0; height: 40%; background: radial-gradient(ellipse 70% 90% at 50% 0%, rgba(34, 215, 242, .14), transparent 70%), linear-gradient(180deg, #0C1219, #04070A); border-top: 1px solid rgba(255, 255, 255, .09); }
.sr-glow { inset: 0; background: radial-gradient(ellipse 58% 48% at 50% 58%, rgba(22, 139, 255, .2), transparent 72%); }
.sr-plate { left: 10%; right: 10%; bottom: 5%; height: 17%; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #2B3947 0%, #121A22 58%, #080C11 100%); border-top: 1px solid rgba(255, 255, 255, .22); box-shadow: 0 0 46px rgba(22, 139, 255, .3), 0 22px 30px rgba(0, 0, 0, .75); }
.sr-plate::after { content: ""; position: absolute; inset: 6% 3%; border-radius: 50%; border: 1px solid rgba(34, 215, 242, .35); box-shadow: 0 0 18px rgba(34, 215, 242, .25); }
.stage-car { position: absolute; left: 8%; right: 8%; top: 5%; bottom: 11%; z-index: 2; }
.stage-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; opacity: 0; transform: translateY(8px) scale(.985); transition: opacity .55s ease, transform .7s cubic-bezier(.2, .7, .2, 1); filter: drop-shadow(0 16px 16px rgba(0, 0, 0, .65)); pointer-events: none; user-select: none; }
.stage-img.in { opacity: 1; transform: none; }
.stage.is-photo .stage-car { left: 4%; right: 4%; top: 4%; bottom: 4%; }
.stage.is-photo .stage-img { object-fit: cover; object-position: 50% 60%; border-radius: 14px; filter: none; -webkit-mask-image: radial-gradient(ellipse 78% 82% at 50% 52%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 78% 82% at 50% 52%, #000 62%, transparent 100%); }
.stage-ph { position: absolute; inset: 0 0 20% 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 0 12%; opacity: 0; transition: opacity .5s; pointer-events: none; }
.stage.is-empty .stage-ph { opacity: 1; }
.stage-ph-name { font-size: clamp(1.1rem, 2.6vw, 2.1rem); font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: rgba(226, 238, 250, .3); text-indent: .26em; }
.stage-ph-note { font-size: .74rem; letter-spacing: .08em; color: rgba(148, 164, 180, .6); }
.stage-ph .stage-add { margin-top: 6px; pointer-events: auto; cursor: pointer; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(34, 215, 242, .55); background: rgba(34, 215, 242, .1); color: var(--k-cyan); font: inherit; font-size: .82rem; font-weight: 600; letter-spacing: .04em; }
.stage-ph .stage-add:hover { background: rgba(34, 215, 242, .2); }
.stage-photo { position: absolute; left: 12px; bottom: 10px; z-index: 4; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(5, 8, 12, .6); border: 1px solid rgba(255, 255, 255, .12); color: var(--text, #E8F1F8); font: inherit; font-size: .78rem; backdrop-filter: blur(6px); }
.stage-photo:hover { border-color: var(--k-cyan); }
.stage-photo:focus-visible, .stage-add:focus-visible { outline: 2px solid var(--k-cyan); outline-offset: 2px; }
.stage-colors { position: absolute; right: 12px; bottom: 10px; z-index: 4; display: flex; gap: 8px; padding: 6px 9px; border-radius: 999px; background: rgba(5, 8, 12, .6); border: 1px solid rgba(255, 255, 255, .08); backdrop-filter: blur(6px); }
.stage-dot { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); background: var(--sw); cursor: pointer; transition: transform .15s, box-shadow .15s; }
.stage-dot:hover { transform: scale(1.12); }
.stage-dot.on { border-color: var(--k-cyan); box-shadow: 0 0 0 2px rgba(34, 215, 242, .25), 0 0 10px rgba(34, 215, 242, .6); }
.stage-dot:focus-visible { outline: 2px solid var(--k-cyan); outline-offset: 2px; }

/* assistente */
.ck-asst { position: relative; display: grid; align-content: center; justify-items: center; gap: 8px; min-width: 0; }
.ck-mascot { padding: 0; border: 0; background: none; cursor: pointer; filter: drop-shadow(0 0 16px rgba(34, 215, 242, .45)); }
.ck-mascot .bolt-mascot { --mc-a: #BFD7EE; --mc-b: #6C8FB3; --mc-eye: #3EE2FF; }
.ck-mascot .bolt-mascot[data-state="attention"] { --mc-a: var(--k-amber); --mc-eye: #FFD28A; }
.ck-mascot .bolt-mascot[data-state="alert"] { --mc-a: var(--k-red); --mc-eye: #FFB3BA; }
.ck-bubble { width: 100%; padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(22, 139, 255, .45); background: linear-gradient(180deg, rgba(20, 38, 58, .85), rgba(10, 18, 28, .9)); font-size: .88rem; line-height: 1.3; box-shadow: 0 0 18px rgba(22, 139, 255, .2); }
.ck-asstsw { display: flex; justify-content: center; }

/* ---- indicadores ---- */
.ck-metrics { flex: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.ck-tile, .ck-card { position: relative; min-width: 0; border-radius: 15px; border: 1px solid var(--k-line); background: linear-gradient(180deg, rgba(27, 38, 50, .92), rgba(12, 18, 25, .94)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 10px 26px rgba(0, 0, 0, .4); }
.ck-tile { --tc: var(--k-blue); display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "ico body" "bar bar"; column-gap: 12px; row-gap: 8px; padding: 12px 14px; align-items: center; transition: border-color .3s, box-shadow .3s; }
.ck-tile[data-tone="cyan"] { --tc: var(--k-cyan); } .ck-tile[data-tone="green"] { --tc: var(--k-green); } .ck-tile[data-tone="amber"] { --tc: #FFB020; } .ck-tile[data-tone="violet"] { --tc: var(--k-violet); }
.ck-tile[data-level="attention"] { --tc: var(--k-amber); border-color: rgba(255, 166, 43, .6); box-shadow: 0 0 18px rgba(255, 166, 43, .2), inset 0 1px 0 rgba(255, 255, 255, .06); }
.ck-tile[data-level="critical"] { --tc: var(--k-red); border-color: var(--k-red); box-shadow: 0 0 20px rgba(240, 68, 82, .3), inset 0 1px 0 rgba(255, 255, 255, .06); }

      body.append(h('article', { class: `alert-item lvl-${a.level}` }, h('span', { class: 'ai-ico' }, ic(a.level === 'info' ? 'info' : 'alert', 20)), h('div', {}, h('strong', {}, a.title, a.simulated ? badge('SIMULAÇÃO', 'sim') : null), h('p', {}, a.message)), a.acknowledged ? h('small', { class: 'muted' }, 'Ciente') : h('button', { type: 'button', class: 'btn btn-sm btn-ghost', on: { click: () => ctx.alerts.acknowledge(a.key) } }, 'Ciente')));
    }
  };
  const off = ctx.alerts.on('changed', paint);
  paint();
  return modal({ title: 'Alertas', icon: 'bell', size: 'md', body, onClose: () => off && off() });
}

boot().catch((err) => {
  console.error(err);
  const root = document.getElementById('app');
  clear(root).append(h('div', { class: 'fatal' }, h('h1', {}, 'A Alma do Carro não pôde iniciar'), h('p', {}, err.message), h('p', { class: 'muted' }, 'Abra o arquivo no Chrome (ou pelo endereço do servidor). Veja o README.')));
  document.getElementById('splash')?.remove();
});

return {  };
})();
})();
</script>
